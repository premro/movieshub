  <script>
    window.IS_CATALYST = typeof window !== "undefined" && (
      window.location.hostname.includes("catalystserverless") ||
      window.location.hostname.includes("zohocatalyst") ||
      window.location.pathname.startsWith("/app")
    );
    window.IS_GITHUB_PAGES = typeof window !== "undefined" && window.location.hostname.endsWith("github.io");

    if (window.IS_CATALYST) {
      window.API_PREFIX = "/server/movieshub_api";
    } else {
      window.API_PREFIX = "https://movieshub-60079640926.development.catalystserverless.in/server/movieshub_api";
    }

    if (window.API_PREFIX) {
      const _origFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === "string") {
          if (url.startsWith("/api/") || url.startsWith("/stream/")) {
            url = window.API_PREFIX + url;
          } else if (url.startsWith("/server/") && !url.startsWith(window.API_PREFIX)) {
            url = window.API_PREFIX + url.replace(/^\/server\/[^\/]+/, "");
          }
        }
        return _origFetch.apply(this, [url, options]);
      };
    }

    function handlePosterError(img, title, year) {
      const pfx = window.API_PREFIX || "";
      if (img.dataset.fallbackTriggered) {
        img.onerror = null;
        img.src = pfx + "/api/poster?title=" + encodeURIComponent(title || "Movieshub") + "&year=" + (year || "2026");
        return;
      }
      img.dataset.fallbackTriggered = "1";
      const currentSrc = img.src || "";
      if (currentSrc.includes("image.tmdb.org")) {
        img.src = pfx + "/api/image_proxy?url=" + encodeURIComponent(currentSrc);
      } else {
        img.src = pfx + "/api/poster?title=" + encodeURIComponent(title || "Movieshub") + "&year=" + (year || "2026");
      }
    }
  </script>
