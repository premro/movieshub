  <script>
    window.IS_CATALYST = typeof window !== "undefined" && (
      window.location.hostname.includes("catalystserverless") ||
      window.location.hostname.includes("zohocatalyst") ||
      window.location.pathname.startsWith("/app")
    );
    window.IS_VERCEL = typeof window !== "undefined" && (
      window.location.hostname.includes("vercel.app") ||
      window.location.hostname.includes("now.sh")
    );
    window.IS_GITHUB_PAGES = typeof window !== "undefined" && window.location.hostname.endsWith("github.io");

    // On Vercel, Catalyst, or Localhost, use relative /server/movieshub_api to stay 100% same-origin with zero CORS errors
    // Only static GitHub Pages requires the remote Zoho Catalyst fallback
    if (window.IS_GITHUB_PAGES) {
      window.API_PREFIX = "https://movieshub-60079640926.development.catalystserverless.in/server/movieshub_api";
    } else {
      window.API_PREFIX = "/server/movieshub_api";
    }

    if (window.API_PREFIX) {
      const _origFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === "string") {
          if (url.startsWith("/api/") || url.startsWith("/stream/")) {
            url = window.API_PREFIX + url;
          } else if (url.startsWith("/server/") && !url.startsWith(window.API_PREFIX)) {
            url = window.API_PREFIX + url.replace(/^\/server\/[^\/]+/, "");
          }
        }
        return _origFetch.apply(this, [url, options]);
      };
    }

    // Anti-Redirect & Anti-Popup Defense Shield (Blocks ad hijackings & rogue popups without sandbox playback blockage)
    (function() {
      window.isStreamPlaying = false;
      window.userIntentionalNavigation = false;

      // 1. Anti-Framebusting Guard: Prevents cross-origin iframes from executing top.location redirects
      window.addEventListener("beforeunload", function(e) {
        if (window.isStreamPlaying && !window.userIntentionalNavigation) {
          e.preventDefault();
          e.returnValue = "Stay on Movieshub";
          return "Stay on Movieshub";
        }
      });

      // 2. Override window.open to block unauthorized popups, ad tabs & redirects
      const _origOpen = window.open;
      window.open = function(url, target, features) {
        if (typeof url === "string" && url.trim().length > 0) {
          try {
            const parsed = new URL(url, window.location.href);
            const allowed = [window.location.hostname, "youtube.com", "www.youtube.com", "youtu.be"];
            if (allowed.some(h => parsed.hostname === h || parsed.hostname.endsWith("." + h))) {
              return _origOpen.call(window, url, target, features);
            }
          } catch (e) {}
          console.warn("[Movieshub Shield] Blocked unauthorized ad popup redirect:", url);
          return null;
        }
        return null;
      };

      // 3. Block rogue external ad clicks & link hijacking
      document.addEventListener("click", function(e) {
        const anchor = e.target && e.target.closest ? e.target.closest("a") : null;
        if (anchor && anchor.href) {
          try {
            const parsed = new URL(anchor.href, window.location.href);
            const isLocal = parsed.hostname === window.location.hostname || anchor.getAttribute("href")?.startsWith("#");
            const isYouTube = parsed.hostname.includes("youtube.com") || parsed.hostname.includes("youtu.be");
            if (!isLocal && !isYouTube) {
              e.preventDefault();
              e.stopPropagation();
              console.warn("[Movieshub Shield] Blocked rogue ad anchor click:", anchor.href);
            } else if (isLocal) {
              window.userIntentionalNavigation = true;
            }
          } catch (err) {}
        }
      }, true);

      // 4. Refocus parent window if iframe tries window blur trick
      window.addEventListener("blur", function() {
        if (window.isStreamPlaying && !window.userIntentionalNavigation) {
          setTimeout(function() {
            try { window.focus(); } catch(err) {}
          }, 60);
        }
      });
    })();

    function handlePosterError(img, title, year) {
      const pfx = window.API_PREFIX || "";
      if (img.dataset.fallbackTriggered) {
        img.onerror = null;
        img.src = pfx + "/api/poster?title=" + encodeURIComponent(title || "Movieshub") + "&year=" + (year || "2026");
        return;
      }
      img.dataset.fallbackTriggered = "1";
      const currentSrc = img.src || "";
      if (currentSrc.includes("image.tmdb.org")) {
        img.src = pfx + "/api/image_proxy?url=" + encodeURIComponent(currentSrc);
      } else {
        img.src = pfx + "/api/poster?title=" + encodeURIComponent(title || "Movieshub") + "&year=" + (year || "2026");
      }
    }
  </script>
